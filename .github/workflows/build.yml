name: Build and Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run linter
        run: npm run lint
      - name: Run type checker
        run: npm run type-check
      # - name: Run tests
      #   run: npm run test
      - name: Build for Firefox
        run: npm run build:firefox
      - name: Package Firefox build
        run: mkdir -p packages && (cd dist/webext-prod && zip -qr ../../packages/ttv-lol-pro-firefox.zip .)
      - name: Clean up
        run: npm run clean
      - name: Build for Chromium
        run: npm run build:chromium
      - name: Package Chromium build
        run: (cd dist/webext-prod && zip -qr ../../packages/ttv-lol-pro-chromium.zip .)
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ttv-lol-pro-${{ github.sha }}
          path: packages/*.zip
          if-no-files-found: error

  # Forks only: exactly one release at a time, holding the packages of the
  # latest `main`. Every other release and tag is deleted first, so the
  # releases page never shows anything stale.
  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'younesaassila/ttv-lol-pro' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/manifest.chromium.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: ttv-lol-pro-${{ github.sha }}
          path: packages
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: latest
        run: |
          version=$(jq -r .version src/manifest.chromium.json)
          # Every release, then every tag left without one.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' |
            while read -r tag; do gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"; done
          gh release create "$TAG" packages/*.zip \
            --latest \
            --target "$GITHUB_SHA" \
            --title "TTV LOL PRO $version (${GITHUB_SHA::7})" \
            --notes "Built from $GITHUB_SHA. Chromium: unzip, then chrome://extensions > Developer mode > Load unpacked > pick the folder. Firefox: about:debugging > This Firefox > Load Temporary Add-on > pick the zip (unsigned, so it lasts until Firefox restarts)."
